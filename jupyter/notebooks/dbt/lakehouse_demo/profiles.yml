# dbt connects to the lab's Trino, catalog `iceberg` (Iceberg tables in the HMS Iceberg REST catalog, data in SeaweedFS).
# Same host name on Docker Compose and Kubernetes (the Service/container is called `trino`).
lakehouse:
  target: lab
  outputs:
    lab:
      type: trino
      method: none                         # the lab's Trino has no authentication
      user: dbt
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | as_number }}"
      database: iceberg                    # Trino catalog
      schema: dbt_demo
      threads: 2
