# Spark Configuration for Jupyter
spark.master=spark://spark-master:7077

# S3 Configuration  
spark.hadoop.fs.s3a.endpoint=http://seaweedfs:8333
spark.hadoop.fs.s3a.access.key=seaweedadmin
spark.hadoop.fs.s3a.secret.key=seaweedadmin123
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.connection.timeout=60000
spark.hadoop.fs.s3a.socket.timeout=60000
spark.hadoop.fs.s3a.request.timeout=60000
spark.hadoop.fs.s3a.threads.keepalivetime=60000
spark.hadoop.fs.s3a.connection.acquisition.timeout=60000
spark.hadoop.fs.s3a.connection.idle.time=60000
spark.hadoop.fs.s3a.connection.request.timeout=60000
spark.hadoop.fs.s3a.connection.timeout=200000
spark.hadoop.fs.s3a.connection.ttl=300000
spark.hadoop.fs.s3a.connection.establish.timeout=60000
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.multipart.purge.age=200000

# Performance tuning
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.executor.memory=2g
spark.executor.cores=2

# Python Configuration - Ensure workers use same Python as driver
spark.pyspark.python=/opt/conda/bin/python
spark.pyspark.driver.python=/opt/conda/bin/python

# Hive Metastore: Spark's built-in Hive 2.3.10 client is used (required by Iceberg's
# HiveCatalog). Do not switch to a Hive 4.x client — see AGENTS.md pitfall #1.
