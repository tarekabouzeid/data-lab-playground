services:
  # SeaweedFS - S3 Compatible Object Storage (master + volume + filer + S3 gateway in one container)
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: seaweedfs
    ports:
      - "8333:8333"  # S3 API
      - "9333:9333"  # Master UI
      - "8889:8888"  # Filer UI (browse buckets under /buckets); host 8888 is Jupyter
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=64
      -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - data-lab-playground

  # PostgreSQL for Hive Metastore
  metastore-db:
    image: postgres:13
    container_name: metastore-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - metastore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-lab-playground

  # Hive Metastore 4.2.1 — Thrift :9083 (Trino hive/lakehouse) + Iceberg REST :9084 (Spark, Trino iceberg)
  hive-metastore:
    image: datalab-playground/hive-metastore:latest
    container_name: hive-metastore
    ports:
      - "9083:9083"
      - "9084:9084"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive123"
    depends_on:
      metastore-db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - data-lab-playground
#  hive-metastore:
#    build:
#      context: ./hive-metastore
#      dockerfile: Dockerfile
#    image: datalab-playground/hive-metastore:latest
#    container_name: hive-metastore
#    ports:
#      - "9083:9083"
#      - "9084:9084"
#    environment:
#      SERVICE_NAME: metastore
#      DB_DRIVER: postgres
#      IS_RESUME: "false"  # Set to true to skip schema init on restarts
#      VERBOSE: "true"
#    depends_on:
#      metastore-db:
#        condition: service_healthy
#      seaweedfs:
#        condition: service_healthy
#    healthcheck:
#      test: ["CMD", "nc", "-z", "localhost", "9083"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 30s
#    networks:
#      - data-lab-playground

  # Trino Coordinator
  trino:
    image: datalab-playground/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino
    depends_on:
      - hive-metastore
      - seaweedfs
    networks:
      - data-lab-playground

  # Apache Spark Master
  spark-master:
    image: datalab-playground/spark:latest
    container_name: spark-master
    environment:
      - AWS_REGION=us-east-1
    ports:
      - "8081:8080"
      - "7077:7077"
    command: >
      sh -c "/opt/spark/sbin/start-master.sh --host 0.0.0.0 --port 7077 --webui-port 8080 &&
             tail -f /opt/spark/logs/*.out"
    networks:
      - data-lab-playground

  # Apache Spark Worker
  spark-worker:
    image: datalab-playground/spark:latest
    container_name: spark-worker
    ports:
      - "8082:8080"
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - AWS_REGION=us-east-1
    command: >
      sh -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --memory 2g --cores 2 --webui-port 8080 &&
             tail -f /opt/spark/logs/*.out"
    depends_on:
      - spark-master
    networks:
      - data-lab-playground

  # Jupyter Notebook with PySpark
  jupyter:
    image: datalab-playground/jupyter:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - JUPYTER_ENABLE_LAB=yes
      - AWS_REGION=us-east-1
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
    depends_on:
      - spark-master
      - seaweedfs
      - trino
      - phoenix
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data-lab-playground

  # Phoenix - AI Observability Platform
  phoenix:
    image: arizephoenix/phoenix:version-20.20.0 # Pinned (was latest); must be greater than 4.0
    container_name: phoenix
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6006:6006"  # PHOENIX_PORT
      - "4317:4317"  # PHOENIX_GRPC_PORT
      - "9090:9090"  # [Optional] PROMETHEUS PORT IF ENABLED
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006'); print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data-lab-playground

  # PostgreSQL Database for Phoenix
  db:
    image: postgres:17
    container_name: phoenix-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-lab-playground

  # Ollama - Local LLM Server with GPU Support
  ollama:
    image: ollama/ollama:0.40.2
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - data-lab-playground

  # Qdrant - Vector Database for AI Applications
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - data-lab-playground

  # Ollama Model Initializer - Pulls gemma3:4b and mxbai-embed-large:latest models on startup
  ollama-init:
    image: ollama/ollama:0.40.2
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: >
      sh -c "
        until curl -f http://ollama:11434/api/tags; do
          echo 'Waiting for Ollama to be ready...'
          sleep 5
        done
        echo 'Pulling gemma3:4b model...'
        ollama pull gemma3:4b
        echo 'Pulling mxbai-embed-large:latest embedding model...'
        ollama pull mxbai-embed-large:latest
        echo 'Models ready!'
      "
    networks:
      - data-lab-playground
    profiles:
      - init

volumes:
  seaweedfs_data:
  metastore_data:
  database_data:
  ollama_data:
  qdrant_data:

networks:
  data-lab-playground:
    driver: bridge