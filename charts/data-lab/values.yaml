  enabled: false
  image:
    # -- Image registry.
    registry: docker.io
    # -- Image repository.
    repository: qdrant/qdrant
    # -- Image tag (the `-unprivileged` variant runs as uid 1000).
    tag: v1.19.2-unprivileged
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  auth:
    # -- Existing Secret holding the API key. Empty: the chart generates `<fullname>-qdrant`.
    existingSecret: ""
    # -- Key in the Secret holding the API key.
    apiKeyKey: api-key
  persistence:
    # -- Use a PVC for `/qdrant/storage`. `false` uses an emptyDir.
    enabled: true
    # -- PVC size.
    size: 5Gi
    # -- StorageClass for this PVC. Empty falls back to `global.storageClass`; `-` sets `storageClassName: ""`.
    storageClass: ""
    # -- PVC access modes.
    accessModes: ["ReadWriteOnce"]
  # -- Container resources.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
