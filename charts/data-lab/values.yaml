ollama:
  # -- Deploy Ollama (local LLM server, no authentication). Needs a GPU to be useful; CPU works but is slow.
  enabled: false
  image:
    # -- Image registry.
    registry: docker.io
    # -- Image repository.
    repository: ollama/ollama
    # -- Image tag.
    tag: "0.40.3"
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- Models pulled at startup (for example `llama3.2:3b`). Pod readiness waits for the pulls.
  models: []
  gpu:
    # -- Request GPUs.
    enabled: false
    # -- Extended resource name of the GPU.
    resourceName: nvidia.com/gpu
    # -- Number of GPUs.
    count: 1
    # Dynamic Resource Allocation instead of the extended resource (needs Kubernetes >= 1.34 and a DRA driver,
    # e.g. the NVIDIA DRA driver). Renders a namespaced ResourceClaimTemplate.
    dra:
      # -- Claim the GPU through DRA (requires `ollama.gpu.enabled`).
      enabled: false
      # -- DeviceClass of the GPU.
      deviceClassName: gpu.nvidia.com
  persistence:
    # -- Use a PVC for models. `false` uses an emptyDir.
    enabled: true
    # -- PVC size.
    size: 20Gi
    # -- StorageClass for this PVC. Empty falls back to `global.storageClass`; `-` sets `storageClassName: ""`.
    storageClass: ""
    # -- PVC access modes.
    accessModes: ["ReadWriteOnce"]
  # -- Container resources.
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {memory: 8Gi}
  # -- Pod securityContext.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  # -- Container securityContext (merged over `global.containerSecurityContext`).
  securityContext: {}
  # -- RuntimeClass for the pod (for example `nvidia`).
  runtimeClassName: ""
  # -- nodeSelector for the pod.
  nodeSelector: {}
  # -- Tolerations for the pod.
  tolerations: []
  # -- Affinity for the pod.
  affinity: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Extra pod annotations.
  podAnnotations: {}

