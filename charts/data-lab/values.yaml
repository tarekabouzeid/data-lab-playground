phoenix:
  # -- Deploy Arize Phoenix (LLM tracing; OTLP gRPC 4317, UI + OTLP HTTP 6006). SQLite storage.
  enabled: false
  image:
    # -- Image registry.
    registry: docker.io
    # -- Image repository.
    repository: arizephoenix/phoenix
    # -- Image tag.
    tag: version-20.21.0-nonroot
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  auth:
    # -- Enable Phoenix authentication (admin user + API keys).
    enabled: true
    # -- Existing Secret holding `secret` (token signing, >= 32 chars) and `admin-password`. Empty: the chart generates `<fullname>-phoenix`.
    existingSecret: ""
  persistence:
    # -- Use a PVC for the SQLite working dir. `false` uses an emptyDir.
    enabled: true
    # -- PVC size.
    size: 2Gi
    # -- StorageClass for this PVC. Empty falls back to `global.storageClass`; `-` sets `storageClassName: ""`.
    storageClass: ""
    # -- PVC access modes.
    accessModes: ["ReadWriteOnce"]
  # -- Container resources.
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}
  # -- Pod securityContext (distroless nonroot: uid 65532).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  # -- Container securityContext (merged over `global.containerSecurityContext`).
  securityContext: {}
  # -- RuntimeClass for the pod.
  runtimeClassName: ""
  # -- nodeSelector for the pod.
  nodeSelector: {}
  # -- Tolerations for the pod.
  tolerations: []
  # -- Affinity for the pod.
  affinity: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Extra pod annotations.
  podAnnotations: {}

tests:
