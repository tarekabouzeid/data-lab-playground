  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  # -- Container securityContext (merged over `global.containerSecurityContext`).
  securityContext: {}
  # -- RuntimeClass for the pod.
  runtimeClassName: ""
  # -- nodeSelector for the pod.
  nodeSelector: {}
  # -- Tolerations for the pod.
  tolerations: []
  # -- Affinity for the pod.
  affinity: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Extra pod annotations.
