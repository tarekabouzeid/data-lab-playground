{{- if .Values.jupyter.enabled }}
{{- $c := .Values.jupyter -}}
{{- $v := .Values -}}
{{- $env := list -}}
{{- if $v.spark.enabled -}}
{{- if $v.spark.auth.enabled -}}
{{- $env = append $env (dict "name" "SPARK_CONNECT_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" (include "datalab.sparkSecretName" .) "key" $v.spark.auth.tokenKey))) -}}
{{- $env = append $env (dict "name" "SPARK_REMOTE" "value" (printf "sc://%s:15002/;authorization=Bearer $(SPARK_CONNECT_TOKEN)" (include "datalab.host" (list . "spark-connect")))) -}}
{{- else -}}
{{- $env = append $env (dict "name" "SPARK_REMOTE" "value" (printf "sc://%s:15002" (include "datalab.host" (list . "spark-connect")))) -}}
{{- end -}}
{{- end -}}
{{- if $v.trino.enabled -}}
{{- $env = append $env (dict "name" "TRINO_HOST" "value" (include "datalab.host" (list . "trino"))) -}}
{{- $env = append $env (dict "name" "TRINO_PORT" "value" "8080") -}}
{{- end -}}
{{- if or $v.seaweedfs.enabled $v.s3.endpoint -}}
{{- $env = append $env (dict "name" "S3_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" (include "datalab.s3SecretName" .) "key" $v.s3.auth.accessKeyKey))) -}}
{{- $env = append $env (dict "name" "S3_SECRET_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" (include "datalab.s3SecretName" .) "key" $v.s3.auth.secretKeyKey))) -}}
{{- end -}}
{{- if $v.qdrant.enabled -}}
{{- $env = append $env (dict "name" "QDRANT_API_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" (include "datalab.qdrantSecretName" .) "key" $v.qdrant.auth.apiKeyKey))) -}}
{{- end -}}
{{- if $v.ollama.enabled -}}
{{- $env = append $env (dict "name" "OLLAMA_HOST" "value" (printf "http://%s:11434" (include "datalab.host" (list . "ollama")))) -}}
{{- end -}}
{{- if $v.phoenix.enabled -}}
{{- $env = append $env (dict "name" "PHOENIX_COLLECTOR_ENDPOINT" "value" (printf "http://%s:6006" (include "datalab.host" (list . "phoenix")))) -}}
{{- end -}}
{{- $container := printf `command: ["start-notebook.py"]
args:
  - --ServerApp.ip=0.0.0.0
  - --ServerApp.port=8888
  # The image bakes a demo password; the chart replaces it with the token from the Secret.
  - --ServerApp.password=
  - --PasswordIdentityProvider.hashed_password=
  - --PasswordIdentityProvider.password_required=False
  - --IdentityProvider.token=$(JUPYTER_TOKEN)
envFrom:
  - configMapRef:
      name: %s
env:
  - name: JUPYTER_TOKEN
    valueFrom:
      secretKeyRef: {name: %s, key: %s}%s
startupProbe:
  httpGet: {path: /api, port: http}
  periodSeconds: 3
  failureThreshold: 100
readinessProbe:
  httpGet: {path: /api, port: http}
  periodSeconds: 10
livenessProbe:
  httpGet: {path: /api, port: http}
  periodSeconds: 20
  failureThreshold: 6` (include "datalab.componentName" (list . "endpoints")) (include "datalab.jupyterSecretName" .) $c.auth.tokenKey (ternary "" (toYaml $env | indent 2 | printf "\n%s") (empty $env)) -}}
{{ include "datalab.simpleComponent" (dict "root" . "component" "jupyter" "values" $c "ports" (list (dict "name" "http" "port" 8888)) "container" $container "dataPath" "/home/jovyan/work") }}
{{- end }}
