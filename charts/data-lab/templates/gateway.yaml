{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway -}}
{{- if and .Values.global.apiChecks (not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/Gateway")) -}}
{{- fail "data-lab: gateway.enabled=true needs the Gateway API (gateway.networking.k8s.io/v1) and an implementation such as Envoy Gateway (hack/workstation/setup-minikube.sh)" -}}
{{- end -}}
{{- $parent := dict "name" (include "datalab.componentName" (list . "gateway")) -}}
{{- if $g.gatewayClassName }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "datalab.componentName" (list . "gateway") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ $g.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ printf "*.%s" $g.domain | quote }}
      allowedRoutes:
        namespaces: {from: Same}
{{- else }}
{{- $parent = dict "name" $g.parentRef.name -}}
{{- with $g.parentRef.namespace }}{{- $_ := set $parent "namespace" . -}}{{- end -}}
{{- with $g.parentRef.sectionName }}{{- $_ := set $parent "sectionName" . -}}{{- end -}}
{{- end }}
{{- range (include "datalab.gatewayRoutes" . | fromYamlArray) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "datalab.componentName" (list $ .name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list $ "gateway") | nindent 4 }}
spec:
  parentRefs:
    - {{- toYaml $parent | nindent 6 }}
  hostnames:
    - {{ .host | quote }}
  rules:
    - backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
      {{- if .longLived }}
      # notebook kernels and other WebSockets outlive any request timeout
      timeouts:
        request: "0s"
      {{- end }}
{{- end }}
{{- end }}
