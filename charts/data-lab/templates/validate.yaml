{{- /* Render-time validation of component combinations. Nothing is rendered. */ -}}
{{- $v := .Values -}}
{{- $s3 := or $v.seaweedfs.enabled (ne $v.s3.endpoint "") -}}
{{- if and $v.seaweedfs.enabled (ne $v.s3.endpoint "") -}}
{{- fail "data-lab: set either seaweedfs.enabled=true or s3.endpoint, not both (s3.endpoint replaces the bundled SeaweedFS)" -}}
{{- end -}}
{{- if and (ne $v.s3.endpoint "") (eq $v.s3.auth.existingSecret "") -}}
{{- fail "data-lab: s3.endpoint (external S3) requires s3.auth.existingSecret with the access key pair" -}}
{{- end -}}
{{- if and $v.hms.enabled (not $s3) -}}
{{- fail "data-lab: hms.enabled=true needs object storage: enable seaweedfs or set s3.endpoint" -}}
{{- end -}}
{{- if and $v.trino.enabled (not $v.hms.enabled) -}}
{{- fail "data-lab: trino.enabled=true requires hms.enabled=true (Trino's hive/iceberg/lakehouse catalogs use the Hive Metastore)" -}}
{{- end -}}
{{- if and $v.gateway.enabled (eq (empty $v.gateway.gatewayClassName) (empty $v.gateway.parentRef.name)) -}}
{{- fail "data-lab: gateway.enabled=true needs exactly one of gateway.gatewayClassName or gateway.parentRef.name" -}}
{{- end -}}
{{- if and $v.semantic.enabled (not $v.trino.enabled) -}}
{{- fail "data-lab: semantic.enabled=true requires trino.enabled=true (the semantic layer compiles to Trino SQL)" -}}
{{- end -}}
{{- if and $v.semantic.enabled (eq $v.semantic.server.auth.mode "jwt") (empty $v.semantic.server.auth.jwt.jwksURL) -}}
{{- fail "data-lab: semantic.server.auth.mode=jwt requires semantic.server.auth.jwt.jwksURL" -}}
{{- end -}}
{{- if and $v.semantic.enabled (not (has $v.semantic.server.auth.mode (list "header" "jwt"))) -}}
{{- fail "data-lab: semantic.server.auth.mode must be header or jwt" -}}
{{- end -}}
{{- if $v.semantic.enabled -}}
{{- /* The upstream manager reconciles every SemanticModel in its namespace and the server serves every compiled
       model there, so two semantic-enabled releases in one namespace would fight. lookup is empty under helm template. */ -}}
{{- range (lookup "apps/v1" "Deployment" .Release.Namespace "").items -}}
{{- $l := .metadata.labels | default dict -}}
{{- if and (eq (get $l "app.kubernetes.io/component") "semantic-manager") (ne (get $l "app.kubernetes.io/instance") $.Release.Name) -}}
{{- fail (printf "data-lab: release %q already runs the Semantic Operator in namespace %q; one semantic-enabled release per namespace (C14)" (get $l "app.kubernetes.io/instance") $.Release.Namespace) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $v.spark.enabled (not $v.hms.enabled) -}}
{{- fail "data-lab: spark.enabled=true requires hms.enabled=true (Spark's Iceberg catalog is the HMS Iceberg REST catalog)" -}}
{{- end -}}
{{- if and $v.airflow.enabled (eq $v.airflow.dags.source "gitSync") (eq $v.airflow.dags.gitSync.repo "") -}}
{{- fail "data-lab: airflow.dags.source=gitSync requires airflow.dags.gitSync.repo" -}}
{{- end -}}
{{- if and $v.spark.enabled (eq $v.spark.master "kubernetes") (not $v.spark.rbac.create) (not $v.spark.serviceAccount.name) -}}
{{- fail "data-lab: spark.master=kubernetes with spark.rbac.create=false needs spark.serviceAccount.name of a ServiceAccount that may manage pods and configmaps in this namespace" -}}
{{- end -}}
{{- if and $v.ollama.enabled $v.ollama.gpu.enabled (not $v.ollama.gpu.resourceName) -}}
{{- fail "data-lab: ollama.gpu.enabled=true requires ollama.gpu.resourceName" -}}
{{- end -}}
{{- if and $v.sparkHistoryMcp.enabled (not $v.spark.enabled) -}}
{{- fail "data-lab: sparkHistoryMcp.enabled=true requires spark.enabled=true and sparkHistory.enabled=true (the MCP server queries the Spark History Server)" -}}
{{- end -}}
{{- if and $v.sparkHistoryMcp.enabled (not $v.sparkHistory.enabled) -}}
{{- fail "data-lab: sparkHistoryMcp.enabled=true requires sparkHistory.enabled=true (the MCP server queries the Spark History Server)" -}}
{{- end -}}
{{- if and $v.airflowMcp.enabled (not $v.airflow.enabled) -}}
{{- fail "data-lab: airflowMcp.enabled=true requires airflow.enabled=true" -}}
{{- end -}}
