{{- /* Generated credentials. Each is skipped when the matching existingSecret is set. */ -}}
{{- $v := .Values -}}
{{- if and (or $v.seaweedfs.enabled $v.hms.enabled $v.spark.enabled $v.trino.enabled) (not $v.s3.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "s3") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "s3") | nindent 4 }}
type: Opaque
data:
  {{ $v.s3.auth.accessKeyKey }}: {{ include "datalab.secretValue" (list . $name $v.s3.auth.accessKeyKey 20) }}
  {{ $v.s3.auth.secretKeyKey }}: {{ include "datalab.secretValue" (list . $name $v.s3.auth.secretKeyKey 40) }}
{{- end }}
{{- if and $v.hms.enabled (not $v.hms.database.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "hms-db") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "hms-db") | nindent 4 }}
type: Opaque
data:
  {{ $v.hms.database.auth.passwordKey }}: {{ include "datalab.secretValue" (list . $name $v.hms.database.auth.passwordKey 32) }}
{{- end }}
{{- if and $v.spark.enabled $v.spark.auth.enabled (not $v.spark.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "spark-connect") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "spark-connect") | nindent 4 }}
type: Opaque
data:
  {{ $v.spark.auth.tokenKey }}: {{ include "datalab.secretValue" (list . $name $v.spark.auth.tokenKey 40) }}
{{- end }}
{{- if and $v.airflow.enabled (or (not $v.airflow.auth.existingSecret) (not $v.airflow.secrets.existingSecret)) }}
{{- $name := include "datalab.componentName" (list . "airflow") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "airflow") | nindent 4 }}
type: Opaque
data:
  {{- if not $v.airflow.auth.existingSecret }}
  username: {{ $v.airflow.auth.username | b64enc }}
  {{ $v.airflow.auth.passwordKey }}: {{ include "datalab.secretValue" (list . $name $v.airflow.auth.passwordKey 24) }}
  {{- end }}
  {{- if not $v.airflow.secrets.existingSecret }}
  {{- /* Fernet key: 32 random chars, base64-encoded (Fernet needs 32 bytes in url-safe base64). */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data (hasKey $existing.data "fernet-key") }}
  fernet-key: {{ index $existing.data "fernet-key" }}
  {{- else }}
  fernet-key: {{ randAlphaNum 32 | b64enc | b64enc }}
  {{- end }}
  jwt-secret: {{ include "datalab.secretValue" (list . $name "jwt-secret" 48) }}
  api-secret-key: {{ include "datalab.secretValue" (list . $name "api-secret-key" 48) }}
  {{- end }}
{{- end }}
{{- if and $v.airflow.enabled (not $v.airflow.database.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "airflow-db") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "airflow-db") | nindent 4 }}
type: Opaque
data:
  {{ $v.airflow.database.auth.passwordKey }}: {{ include "datalab.secretValue" (list . $name $v.airflow.database.auth.passwordKey 32) }}
{{- end }}
{{- if and $v.jupyter.enabled (not $v.jupyter.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "jupyter") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "jupyter") | nindent 4 }}
type: Opaque
data:
  {{ $v.jupyter.auth.tokenKey }}: {{ include "datalab.secretValue" (list . $name $v.jupyter.auth.tokenKey 40) }}
{{- end }}
{{- if and $v.qdrant.enabled (not $v.qdrant.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "qdrant") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "qdrant") | nindent 4 }}
type: Opaque
data:
  {{ $v.qdrant.auth.apiKeyKey }}: {{ include "datalab.secretValue" (list . $name $v.qdrant.auth.apiKeyKey 40) }}
{{- end }}
{{- if and $v.phoenix.enabled $v.phoenix.auth.enabled (not $v.phoenix.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "phoenix") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "phoenix") | nindent 4 }}
type: Opaque
data:
  {{- /* Phoenix requires >= 32 chars with a digit and a lowercase letter. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data (hasKey $existing.data "secret") }}
  secret: {{ index $existing.data "secret" }}
  {{- else }}
  secret: {{ printf "%s%s%s" (randAlphaNum 40) (randNumeric 4) (randAlpha 4 | lower) | b64enc }}
  {{- end }}
  admin-password: {{ include "datalab.secretValue" (list . $name "admin-password" 24) }}
{{- end }}
{{- if and $v.airflow.enabled $v.airflowMcp.enabled (not $v.airflowMcp.auth.existingSecret) }}
{{- $name := include "datalab.componentName" (list . "airflow-mcp") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datalab.componentLabels" (list . "airflow-mcp") | nindent 4 }}
type: Opaque
data:
  {{ $v.airflowMcp.auth.passwordKey }}: {{ include "datalab.secretValue" (list . $name $v.airflowMcp.auth.passwordKey 24) }}
{{- end }}
