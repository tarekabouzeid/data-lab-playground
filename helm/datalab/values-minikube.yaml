# Overrides for a local minikube node (setup-minikube.sh default: 8 CPUs / 24 GiB).
# Parity note: only sizing and the notebook mount differ from values.yaml; images and versions are untouched.

jupyter:
  notebooks:
    mode: hostPath                # minikube mounts <repo>/jupyter/notebooks at /datalab/notebooks (setup-minikube.sh)
    hostPath: /datalab/notebooks

trino:
  # The image's jvm.config with -Xmx4G instead of -Xmx8G
  jvmConfig: |-
    # Java 11 Server VM optimizations
    -server
    -Xmx4G
    -XX:InitialRAMPercentage=80
    -XX:MaxRAMPercentage=80
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+UseG1GC
    -XX:+UseGCOverheadLimit
    -XX:+ExitOnOutOfMemoryError
    -XX:ReservedCodeCacheSize=512M
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
  resources:
    requests: {cpu: 500m, memory: 3Gi}
    limits: {memory: 6Gi}

spark:
  executor: {instances: 1, cores: 2, memory: 2g}

ollama:
  resources: {requests: {cpu: 500m, memory: 2Gi}}
