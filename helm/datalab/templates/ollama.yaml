{{- if .Values.ollama.enabled }}
{{- $n := "ollama" }}
{{- $mode := .Values.gpu.mode }}
{{- if not (has $mode (list "device-plugin" "dra" "none")) }}
{{- fail (printf "gpu.mode must be device-plugin, dra or none, got %q" $mode) }}
{{- end }}
{{- $img := include "datalab.image" .Values.images.ollama }}
{{- if eq $mode "dra" }}
{{- include "datalab.requireAPI" (dict "ctx" . "api" "resource.k8s.io/v1/ResourceClaimTemplate" "hint" "gpu.mode=dra needs Dynamic Resource Allocation (GA since Kubernetes 1.34) and the NVIDIA DRA driver (setup-minikube.sh --gpu-mode dra).") }}
# Dynamic Resource Allocation: one NVIDIA GPU, allocated by the NVIDIA DRA driver (DeviceClass {{ .Values.gpu.dra.deviceClassName }}).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: ollama-gpu
  labels: {{- include "datalab.labels" (dict "ctx" . "name" $n) | nindent 4 }}
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: {{ .Values.gpu.dra.deviceClassName }}
            allocationMode: ExactCount
            count: {{ .Values.gpu.count }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  labels: {{- include "datalab.labels" (dict "ctx" . "name" $n) | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {{- include "datalab.labels" (dict "ctx" . "name" $n) | nindent 4 }}
spec:
  selector: {{- include "datalab.selector" (dict "ctx" . "name" $n) | nindent 4 }}
  ports:
    - {name: http, port: 11434}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: {{- include "datalab.labels" (dict "ctx" . "name" $n) | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}   # one GPU, one PVC (RWO): never two pods at once
  selector:
    matchLabels: {{- include "datalab.selector" (dict "ctx" . "name" $n) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "datalab.labels" (dict "ctx" . "name" $n) | nindent 8 }}
    spec:
      {{- include "datalab.podDefaults" . | nindent 6 }}
      {{- if eq $mode "dra" }}
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: ollama-gpu
      {{- end }}
      containers:
        - name: ollama
          image: {{ $img }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            # NVIDIA_VISIBLE_DEVICES is deliberately NOT set (compose sets "all"): the device plugin / DRA driver
            # decides which GPU the container sees.
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          ports:
            - {name: http, containerPort: 11434}
          startupProbe:          # compose healthcheck: `ollama list`
            exec: &ollamaReady
              command: ["ollama", "list"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: *ollamaReady
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- $r := deepCopy .Values.ollama.resources }}
            {{- if eq $mode "device-plugin" }}
            {{- $_ := set $r "limits" (merge (default (dict) (get $r "limits")) (dict "nvidia.com/gpu" .Values.gpu.count)) }}
            {{- else if eq $mode "dra" }}
            {{- $_ := set $r "claims" (list (dict "name" "gpu")) }}
            {{- end }}
            {{- toYaml $r | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /root/.ollama}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ollama-data}
{{- if .Values.ollama.pullModels }}
---
# compose: the `ollama-init` profile service. The pull goes through the server (OLLAMA_HOST), so no GPU or volume here.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-{{ printf "%s%s" $img (join "," .Values.ollama.models) | sha256sum | trunc 8 }}
  labels: {{- include "datalab.labels" (dict "ctx" . "name" "ollama-pull" "component" "ollama") | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "datalab.labels" (dict "ctx" . "name" "ollama-pull" "component" "ollama") | nindent 8 }}
    spec:
      {{- include "datalab.podDefaults" . | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: {{ $img }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: OLLAMA_HOST, value: "http://ollama:11434"}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # the ollama image has no curl; `ollama list` talks to the server at OLLAMA_HOST
              until ollama list >/dev/null 2>&1; do echo "Waiting for Ollama to be ready..."; sleep 5; done
              for m in {{ range .Values.ollama.models }}{{ . | quote }} {{ end }}; do
                echo "Pulling $m ..."; ollama pull "$m" || exit 1
              done
              echo "Models ready!"
{{- end }}
{{- end }}
