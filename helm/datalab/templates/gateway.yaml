{{- if .Values.gateway.enabled }}
{{- include "datalab.requireAPI" (dict "ctx" . "api" "gateway.networking.k8s.io/v1/Gateway" "hint" "Install a Gateway API implementation first (Envoy Gateway: helm/scripts/setup-minikube.sh) or set gateway.enabled=false.") }}
{{- $g := .Values.gateway }}
{{- if $g.createClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $g.className }}
  labels: {{- include "datalab.labels" (dict "ctx" . "name" "gateway") | nindent 4 }}
spec:
  controllerName: {{ $g.controllerName }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: datalab
  labels: {{- include "datalab.labels" (dict "ctx" . "name" "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ printf "*.%s" $g.domain | quote }}
      allowedRoutes:
        namespaces: {from: Same}
{{- range $g.routes }}
{{- if (index $.Values .component).enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  labels: {{- include "datalab.labels" (dict "ctx" $ "name" "gateway") | nindent 4 }}
spec:
  parentRefs:
    - {name: datalab}
  hostnames:
    - {{ printf "%s.%s" .name $g.domain | quote }}
  rules:
    - backendRefs:
        - {name: {{ tpl .service $ }}, port: {{ .port }}}
      {{- if eq .name "jupyter" }}
      # notebook kernels run over WebSockets and idle for long periods
      timeouts: {request: "0s"}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
