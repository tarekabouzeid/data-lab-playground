connector.name=lakehouse
hive.metastore.uri=thrift://hive-metastore:9083

# Disable transactional features completely to avoid Hive Metastore 4.x compatibility issues
hive.non-managed-table-writes-enabled=true
hive.non-managed-table-creates-enabled=true
hive.target-max-file-size=1GB
hive.compression-codec=SNAPPY

# Enable native S3 file system support
fs.native-s3.enabled=true

# S3/MinIO Configuration
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123

# Iceberg specific configurations
iceberg.file-format=PARQUET
iceberg.compression-codec=SNAPPY