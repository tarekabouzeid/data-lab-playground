connector.name=iceberg
# Iceberg tables via the Hive Metastore 4.2.1 built-in Iceberg REST catalog
# (same commit path as Spark). Tables are still stored in HMS, so the `lakehouse`
# catalog (Thrift) sees them too.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://hive-metastore:9084/iceberg

# Enable native S3 file system support
fs.native-s3.enabled=true

# S3/SeaweedFS Configuration
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=seaweedadmin
s3.aws-secret-key=seaweedadmin123

# Iceberg specific configurations
iceberg.file-format=PARQUET
iceberg.compression-codec=SNAPPY
